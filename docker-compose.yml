services:

  # ─────────────────────────────────────
  # Laravel Application
  # ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_sms
    restart: unless-stopped
    ports:
      - "8080:80"          # Direct access for testing: http://localhost:8080
    volumes:
      - sqlite_data:/var/www/html/database        # Persist SQLite across restarts
      - storage_data:/var/www/html/storage        # Persist uploaded files & logs
    environment:
      APP_NAME: "Student Management System"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://sms.almutasim.site
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      LOG_LEVEL: error
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────
  # Reverse Proxy with automatic HTTPS
  # (Caddy handles SSL for sms.almutasim.site)
  # ─────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  sqlite_data:
    driver: local
  storage_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
