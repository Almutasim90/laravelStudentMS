# ─────────────────────────────────────────────────────────────
# Nginx configuration for Coolify deployment
#
# NO server_name is set here — Coolify's built-in reverse proxy
# (Traefik) handles domain routing and SSL for sms.almutasim.site.
# This Nginx only serves Laravel on port 80 inside the container.
# ─────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets — long cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        # Pass real IP from Coolify's reverse proxy
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block direct access to sensitive files
    location ~* \.(env|sqlite|log)$ {
        deny all;
        return 404;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
